name: Diploma CI/CD

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline application and release tests
        run: |
          python3 ci/smoke.py
          python3 -m unittest discover -s tests -v

  build-and-push:
    needs: test
    # Task142 publication must be test-only. Other trusted branch/tag pushes publish.
    if: >-
      github.repository == 'myachmen/netology-diploma-app' &&
      github.event_name == 'push' &&
      github.ref != 'refs/heads/feature/diploma-minimal-cd-142'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      release: ${{ steps.release.outputs.valid }}
      source_sha: ${{ steps.release.outputs.sha }}
      source_tag: ${{ steps.release.outputs.tag }}
      source_run: ${{ steps.release.outputs.run }}
      app_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and image tags
        id: release
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          python3 -m ci.release --build-output "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to existing Yandex Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_KEY_JSON }}
      - name: Build and push exact source
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=https://github.com/myachmen/netology-diploma-app
            io.github.actions.run-id=${{ github.run_id }}

  # PREPARATION: remove only literal false after explicit live-release approval.
  deploy:
    needs: [test, build-and-push]
    if: >-
      false &&
      github.repository == 'myachmen/netology-diploma-app' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      github.run_attempt == 1 &&
      needs.test.result == 'success' &&
      needs['build-and-push'].result == 'success' &&
      needs['build-and-push'].outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    concurrency:
      group: diploma-app-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified kubectl v1.33.7
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]]
          download_dir="$(mktemp -d)"
          trap 'rm -rf -- "$download_dir"' EXIT
          cd "$download_dir"
          base_url='https://dl.k8s.io/release/v1.33.7/bin/linux/amd64'
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --output kubectl "$base_url/kubectl"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 15 --output kubectl.sha256 "$base_url/kubectl.sha256"
          checksum="$(cat kubectl.sha256)"
          [[ "$checksum" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s  kubectl\n' "$checksum" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/diploma-cd-bin"
          install -m 0755 kubectl "$RUNNER_TEMP/diploma-cd-bin/kubectl"
          printf '%s\n' "$RUNNER_TEMP/diploma-cd-bin" >> "$GITHUB_PATH"
      - name: Deploy this run digest and verify application
        env:
          BUILD_RESULT: ${{ needs['build-and-push'].result }}
          IMAGE_DIGEST: ${{ needs['build-and-push'].outputs.digest }}
          SOURCE_SHA: ${{ needs['build-and-push'].outputs.source_sha }}
          SOURCE_TAG: ${{ needs['build-and-push'].outputs.source_tag }}
          SOURCE_RUN: ${{ needs['build-and-push'].outputs.source_run }}
          APP_VERSION: ${{ needs['build-and-push'].outputs.app_version }}
          SSH_HOST: ${{ vars.CD_SSH_HOST }}
          SSH_USER: ${{ vars.CD_SSH_USER }}
          API_TLS_NAME: ${{ vars.CD_API_TLS_NAME }}
          APP_URL: ${{ vars.CD_APP_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CD_SSH_KNOWN_HOSTS }}
          KUBE_CA_B64: ${{ secrets.CD_KUBE_CA_B64 }}
          KUBE_TOKEN: ${{ secrets.CD_KUBE_TOKEN }}
        run: bash ci/deploy.sh
