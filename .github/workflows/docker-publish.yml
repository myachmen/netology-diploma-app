
name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - feature/diploma-ci-cd-prep-137
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline application and release security tests
        run: |
          python3 ci/smoke.py
          python3 -m unittest discover -s tests -v

  build-and-push:
    needs: test
    # Preparation branch / PR / dispatch runs test only, without registry secrets.
    if: >-
      github.repository == 'myachmen/netology-diploma-app' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      release: ${{ steps.release.outputs.valid }}
      source_sha: ${{ steps.release.outputs.sha }}
      source_tag: ${{ steps.release.outputs.tag }}
      source_run: ${{ steps.release.outputs.run }}
      app_version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Identify and validate release provenance
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cat ci/VERSION)"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          valid=false
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" == "v$version" ]]
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
            valid=true
          else
            [[ "$GITHUB_REF" == refs/heads/main ]]
          fi
          {
            echo "valid=$valid"
            echo "sha=$GITHUB_SHA"
            echo "tag=$REF_NAME"
            echo "run=$GITHUB_RUN_ID"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_KEY_JSON }}

      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            yamarkya/netology-diploma-app
            cr.yandex/crpb1oihnpa2uai8m3mp/netology-diploma-app
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=https://github.com/myachmen/netology-diploma-app
            io.github.actions.run-id=${{ github.run_id }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # PREPARATION ONLY. Literal false is mandatory until separate user approval.
  # An environment name is a future configuration reference, not proof of approvals.
  deploy:
    needs: [test, build-and-push]
    if: >-
      false &&
      github.repository == 'myachmen/netology-diploma-app' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      github.run_attempt == 1 &&
      needs.test.result == 'success' &&
      needs['build-and-push'].result == 'success' &&
      needs['build-and-push'].outputs.release == 'true' &&
      vars.CD_ENABLED == 'true' && vars.CD_SSH_TUNNEL_APPROVED == 'true'
    environment: diploma-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    concurrency:
      group: diploma-app-production
      cancel-in-progress: false
    steps:
      - name: Checkout trusted release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install verified kubectl v1.33.7
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]] || exit 1
          download_dir="$(mktemp -d)"
          trap 'rm -rf -- "$download_dir"' EXIT
          cd "$download_dir"
          base_url='https://dl.k8s.io/release/v1.33.7/bin/linux/amd64'
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --retry 2 \
            --output kubectl "$base_url/kubectl"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 30 --retry 2 \
            --output kubectl.sha256 "$base_url/kubectl.sha256"
          checksum="$(cat kubectl.sha256)"
          [[ "$checksum" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          printf '%s  kubectl\n' "$checksum" | sha256sum --check --strict
          install_dir="$RUNNER_TEMP/diploma-cd-bin"
          mkdir -p "$install_dir"
          install -m 0755 kubectl "$install_dir/kubectl"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Deploy same-run immutable digest (DISABLED job)
        shell: bash
        env:
          BUILD_RESULT: ${{ needs['build-and-push'].result }}
          IMAGE_DIGEST: ${{ needs['build-and-push'].outputs.digest }}
          SOURCE_SHA: ${{ needs['build-and-push'].outputs.source_sha }}
          SOURCE_TAG: ${{ needs['build-and-push'].outputs.source_tag }}
          SOURCE_RUN: ${{ needs['build-and-push'].outputs.source_run }}
          APP_VERSION: ${{ needs['build-and-push'].outputs.app_version }}
          CD_ENABLED: ${{ vars.CD_ENABLED }}
          CD_SSH_TUNNEL_APPROVED: ${{ vars.CD_SSH_TUNNEL_APPROVED }}
          SSH_HOST: ${{ vars.CD_SSH_HOST }}
          SSH_USER: ${{ vars.CD_SSH_USER }}
          API_TLS_NAME: ${{ vars.CD_API_TLS_NAME }}
          APP_URL: ${{ vars.CD_APP_URL }}
          SSH_PRIVATE_KEY: ${{ secrets.CD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CD_SSH_KNOWN_HOSTS }}
          KUBE_CA_B64: ${{ secrets.CD_KUBE_CA_B64 }}
          KUBE_TOKEN: ${{ secrets.CD_KUBE_TOKEN }}
        run: bash ci/deploy.sh
